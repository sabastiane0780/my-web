<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            color: #333;
        }

        h2, h3 {
            text-align: center;
            color: #0056b3;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 20px;
        }

        .gallery img, .gallery video {
            border: 3px solid #ccc;
            border-radius: 8px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .gallery img:hover, .gallery video:hover {
            transform: scale(1.05);
            border-color: #0056b3;
        }

        .gallery img {
            width: 30%;
            max-width: 300px;
        }

        .gallery video {
            width: 45%;
            max-width: 600px;
        }

        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 10px;
            position: fixed;
            width: 100%;
            bottom: 0;
            margin-top: 20px;
        }

        a {
            display: block;
            text-align: center;
            margin: 20px 0;
            color: #0056b3;
            font-size: 18px;
            text-decoration: none;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        a:hover {
            color: #ffcc00;
        }

        @media (max-width: 768px) {
            .gallery img, .gallery video {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <h2>Gallery</h2>

    <div class="gallery">
        <!-- Images -->
        <img src="gallery/FIRST.PNG" alt="Image 1">
        <img src="gallery/SECOND.PNG" alt="Image 2">
        <img src="gallery/THIRD.PNG" alt="Image 3">
        <img src="gallery/FORTH.PNG" alt="Image 4">
        <img src="gallery/DEBATE1.PNG" alt="Debate Image 1">
        <img src="gallery/DEBATE2.JPG" alt="Debate Image 2">
        <img src="gallery/TOUR1.jpg" alt="Tour Image 1">
        <img src="gallery/FIELD.JPG" alt="Field Image 1">
        <img src="gallery/FIELD2.JPG" alt="Field Image 2">
        <img src="gallery/NETWORK1.JPG" alt="Network Image 1">
        <img src="gallery/NETWORK.JPG" alt="Network Image 2">
        <img src="gallery/ANAASU1.jpg" alt="Anaasu Image 1">
        <img src="gallery/ANAASU2.jpg" alt="Anaasu Image 2">
        <img src="gallery/JNLC ANNUAL.JPG" alt="JNLC Annual Event">
    </div>

    <h3>My Coverages and Tours</h3>

    <div class="gallery">
        <!-- Videos -->
        <video src="gallery/SSURA.mov" controls></video>
        <video src="gallery/JINJA TRIP.mov" controls></video>
        <video src="gallery/JINJA TRIP1.mov" controls></video>
        <video src="gallery/JINJA TRIP2.mov" controls></video>
        <video src="gallery/JINJA TRIP3.mov" controls></video>
        <video src="gallery/FIELDWORK.mov" controls></video>
        <video src="gallery/FIELDWORK2.mov" controls></video>
        <video src="gallery/FIELDWORK4.mov" controls></video>
        <video src="gallery/FILED.mov" controls></video>
        <video src="gallery/INNOVATION VILLAGE.mov" controls></video>
        <video src="gallery/OVERNIGHT.mov" controls></video>
        <video src="gallery/ST BARNABUS 1 (2).mov" controls></video>
    </div>

    <a href="HOME.html">Back to Home Page</a>

    <footer>
        <p>&copy; Dg Śábź Technologies.</p>
    </footer>

</body>
</html>
